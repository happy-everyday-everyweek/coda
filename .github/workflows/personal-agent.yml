name: Personal Agent

on:
  push:
    branches: [personal-agent]
  pull_request:
    branches: [personal-agent]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: 编译 Kotlin 与生成 Python 包
        run: |
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          [ -x "$AAPT2" ] || AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          ./gradlew :app:compileDebugKotlin \
            -x installDebugPythonRequirements \
            -Pandroid.aapt2FromMavenOverride="$AAPT2" \
            --stacktrace

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYO3_CROSS: "1"
      PYO3_CROSS_PYTHON_VERSION: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 准备 Android SDK 与 NDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;36.0.0" "ndk;28.2.13676358" > /dev/null 2>&1
          echo "NDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: 构建 APK
        run: |
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          ./gradlew :app:assembleDebug \
            -Pandroid.aapt2FromMavenOverride="$AAPT2" \
            --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: coda-personal-agent-debug
          path: app/build/outputs/apk/debug/*.apk