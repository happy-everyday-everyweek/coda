name: Personal Agent

on:
  push:
    branches: [personal-agent]
  pull_request:
    branches: [dev, personal-agent]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: 编译 Kotlin 与生成 Python 包
        run: |
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          [ -x "$AAPT2" ] || AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          ./gradlew :app:compileDebugKotlin \
            -x installDebugPythonRequirements \
            -Pandroid.aapt2FromMavenOverride="$AAPT2" \
            --stacktrace

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYO3_CROSS: "1"
      PYO3_CROSS_PYTHON_VERSION: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 准备 Android SDK 与 NDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;36.0.0" "ndk;28.2.13676358" > /dev/null 2>&1
          echo "NDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: 构建 pydantic-core wheel
        run: |
          python -m pip download pydantic-core==2.50.2 --no-binary=:all: --no-deps -d /tmp/pc
          tar -xf /tmp/pc/pydantic_core-2.50.2.tar.gz -C /tmp/pc
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android26-clang"
          mkdir -p /tmp/fakelib
          "$TC/aarch64-linux-android26-clang" -shared -fPIC -o /tmp/fakelib/libpython3.12.so -x c /dev/null
          export RUSTFLAGS="-L native=/tmp/fakelib"
          (cd /tmp/pc/pydantic_core-2.50.2 && cargo build --release --target aarch64-linux-android --features pyo3/extension-module)
          python tools/build-pydantic-wheel.py
          ls -l app/wheels

      - name: 构建 jiter wheel
        run: |
          python -m pip download jiter==0.18.0 --no-binary=:all: --no-deps -d /tmp/jt
          tar -xf /tmp/jt/jiter-0.18.0.tar.gz -C /tmp/jt
          ls /tmp/jt/jiter-0.18.0
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android26-clang"
          export RUSTFLAGS="-L native=/tmp/fakelib"
          (cd /tmp/jt/jiter-0.18.0 && cargo build --release --target aarch64-linux-android -p jiter-python --features pyo3/extension-module)
          python tools/build-jiter-wheel.py /tmp/jt/jiter-0.18.0
          ls -l app/wheels

      - name: 构建 rpds-py 垫片轮子
        run: |
          python tools/build-rpds-wheel.py
          ls -l app/wheels

      - name: 构建 APK
        run: |
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          ./gradlew :app:assembleDebug \
            -Pandroid.aapt2FromMavenOverride="$AAPT2" \
            --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: coda-personal-agent-debug
          path: app/build/outputs/apk/debug/*.apk