name: Dev Prerelease

# dev 分支每次变更：先重建内核二进制，再用 debug 变体打包，
# 结果覆盖到那一个固定的预发行版本 dev-latest，始终保持只有一个预发行版本。
on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-prerelease
  cancel-in-progress: true

jobs:
  prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本号
        run: |
          BASE="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)"
          # versionCode 由 tools/version-code.py 按「构建时刻 + 渠道位」算出：
          #   code = 距基准日的分钟数 * 2 + 渠道位（dev=0 / 正式=1）
          # 两个渠道落在同一条时间序列上，所以能互相覆盖：
          #   同一分钟里 正式(…1) > dev(…0) → dev 用户能升到正式版
          #   而下一分钟的 dev 一定大于上一分钟的正式版 → dev 能覆盖正式版
          # 用户的实际流程（正式版 → dev → 下一个正式版）正是靠这一点成立的。
          CODE="$(python3 tools/version-code.py --channel dev)"
          echo "CODA_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "CODA_VERSION_NAME=${BASE:-dev}" >> "$GITHUB_ENV"
          # 仓库内固定密钥（keystore/coda-debug.jks）的证书摘要，核对步骤用它比对。
          echo "CODA_SIGNER_SHA256=05011c837e7fd75ae390c9f5d627f4618324676896ff0fbe04146607db841c35" >> "$GITHUB_ENV"
          {
            echo "dev 构建使用 debug 变体。"
            echo ""
            echo "版本名：${BASE:-dev}"
            echo "版本号：$CODE（时间序列 × 2 + 0）"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: pnpm
          cache-dependency-path: kernel/zcode/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 不用 android-actions/setup-android：它的 sdkmanager --licenses 在新版 cmdline-tools
      # 下会停在交互确认（Accept? y/N）并让整步失败。这里改用 runner 预装的 cmdline-tools。
      - name: 准备 Android SDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;36.0.0" > /dev/null 2>&1 || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      # 载荷每次都在 CI 内重建，不复用任何缓存，避免发出陈旧的内核二进制。
      - name: 重建内核二进制载荷
        run: tools/build-core-payload.sh
      # 注入写坏的载荷装到设备上只会以信号退出，看不出原因；这里先核对结构，坏了当场失败。
      - name: 核对内核载荷结构
        run: python3 tools/verify-sea-payload.py app/src/main/assets/core/zcode

      - name: 打包 debug APK
        run: |
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          [ -x "$AAPT2" ] || AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          echo "aapt2: $AAPT2"
          ./gradlew :app:assembleDebug \
            -PcodaVersionName="$CODA_VERSION_NAME" \
            -PcodaVersionCode="$CODA_VERSION_CODE" \
            -Pandroid.aapt2FromMavenOverride="$AAPT2"

      - name: 收集产物
        run: |
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          cp "$APK" "coda-dev.apk"
          sha256sum coda-dev.apk | tee sha256.txt
          # 实验性 Web UI 的前端资产：不打进 APK，作为 Release 附件由 App 运行时拉取。
          cd webui && zip -q ../coda-webui.zip index.html && cd ..

      # 应用内更新读取的版本清单。App 走 releases/download/<tag>/update-dev.json 静态下载，
      # 不消耗 GitHub API 的 60 次/小时限额，并且带 sha256 供下载后校验。
      - name: 生成更新清单
        run: |
          SIZE="$(stat -c%s coda-dev.apk)"
          SHA="$(cut -d' ' -f1 sha256.txt)"
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/dev-latest/coda-dev.apk"
          python3 - "$SIZE" "$SHA" "$APK_URL" <<'PY'
          import json, os, sys, datetime
          size, sha, url = sys.argv[1], sys.argv[2], sys.argv[3]
          data = {
              "schemaVersion": 1,
              "channel": "dev",
              "tag": "dev-latest",
              "versionCode": int(os.environ["CODA_VERSION_CODE"]),
              "versionName": os.environ["CODA_VERSION_NAME"],
              "apkUrl": url,
              "size": int(size),
              "sha256": sha,
              "publishedAt": datetime.datetime.now(datetime.timezone.utc)
                               .replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "notes": "",
          }
          with open("update-dev.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      # 签名必须每次都一样：签名一换，设备上就装不上新版本，只能卸载重装。
      # 这里把证书摘要打出来并与仓库固定密钥比对，不一致当场失败。
      - name: 核对签名
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          [ -x "$APKSIGNER" ] || APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs coda-dev.apk
          SIGNER="$("$APKSIGNER" verify --print-certs coda-dev.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':' | tr 'A-Z' 'a-z')"
          echo "签名摘要 $SIGNER"
          if [ "$SIGNER" != "$CODA_SIGNER_SHA256" ]; then
            echo "!! 签名与仓库固定密钥不一致：期望 $CODA_SIGNER_SHA256" >&2
            exit 1
          fi

      - name: 更新唯一的预发行版本
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="dev-latest"
          HEAD_SHORT="$(git rev-parse --short "$GITHUB_SHA")"
          HEAD_SUBJECT="$(git log -1 --format=%s "$GITHUB_SHA")"
          SINCE="$(date -u +%F)T00:00:00Z"

          # 近期变更：当天（UTC）的全部提交；当天只有这一条时就是它自己。
          RECENT="$(git log --since="$SINCE" --format='%h %s' "$GITHUB_SHA")"
          [ -n "$RECENT" ] || RECENT="$(git log -1 --format='%h %s' "$GITHUB_SHA")"

          # 关联的 ISSUE：提交信息里出现过的 #编号，取标题附在近期变更末尾。
          ISSUE_LINES=""
          for NUMBER in $(git log --since="$SINCE" --format='%s%n%b' "$GITHUB_SHA" \
            | grep -oE '#[0-9]+' | tr -d '#' | sort -un); do
            TITLE="$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER" --jq .title 2>/dev/null || true)"
            [ -n "$TITLE" ] && ISSUE_LINES="${ISSUE_LINES}- Issue #$NUMBER $TITLE"$'\n'
          done

          {
            echo '## 本次变更'
            echo
            echo "- \`$HEAD_SHORT\` $HEAD_SUBJECT"
            echo
            echo '## 近期变更'
            echo
            echo "$RECENT" | sed -E 's/^([0-9a-f]+) /- `\1` /'
            if [ -n "$ISSUE_LINES" ]; then
              echo
              printf '%s' "$ISSUE_LINES"
            fi
          } > notes.md

          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" coda-dev.apk coda-webui.zip sha256.txt update-dev.json \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "开发预览版" \
            --notes-file notes.md

          echo "---" >> "$GITHUB_STEP_SUMMARY"
          cat notes.md >> "$GITHUB_STEP_SUMMARY"