name: Dev Prerelease

# dev 分支每次变更：先重建内核二进制，再用 debug 变体打包，
# 结果覆盖到那一个固定的预发行版本 dev-latest，始终保持只有一个预发行版本。
on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-prerelease
  cancel-in-progress: true

jobs:
  prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本号
        run: |
          BASE="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)"
          echo "CODA_VERSION_NAME=${BASE:-dev}" >> "$GITHUB_ENV"
          {
            echo "dev 构建使用 debug 变体。"
            echo ""
            echo "版本名：${BASE:-dev}+dev.${{ github.run_number }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: pnpm
          cache-dependency-path: kernel/zcode/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 不用 android-actions/setup-android：它的 sdkmanager --licenses 在新版 cmdline-tools
      # 下会停在交互确认（Accept? y/N）并让整步失败。这里改用 runner 预装的 cmdline-tools。
      - name: 准备 Android SDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;36.0.0" > /dev/null 2>&1 || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      # 载荷每次都在 CI 内重建，不复用任何缓存，避免发出陈旧的内核二进制。
      - name: 重建内核二进制载荷
        run: tools/build-core-payload.sh

      - name: 打包 debug APK
        run: |
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          [ -x "$AAPT2" ] || AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          echo "aapt2: $AAPT2"
          ./gradlew :app:assembleDebug \
            -PcodaVersionName="$CODA_VERSION_NAME" \
            -Pandroid.aapt2FromMavenOverride="$AAPT2"

      - name: 收集产物
        run: |
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          cp "$APK" "coda-dev.apk"
          sha256sum coda-dev.apk | tee sha256.txt

      - name: 更新唯一的预发行版本
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="dev-latest"
          HEAD_SHORT="$(git rev-parse --short "$GITHUB_SHA")"
          HEAD_SUBJECT="$(git log -1 --format=%s "$GITHUB_SHA")"
          SINCE="$(date -u +%F)T00:00:00Z"

          # 近期变更：当天（UTC）的全部提交；当天只有这一条时就是它自己。
          RECENT="$(git log --since="$SINCE" --format='%h %s' "$GITHUB_SHA")"
          [ -n "$RECENT" ] || RECENT="$(git log -1 --format='%h %s' "$GITHUB_SHA")"

          # 关联的 ISSUE：提交信息里出现过的 #编号，取标题附在近期变更末尾。
          ISSUE_LINES=""
          for NUMBER in $(git log --since="$SINCE" --format='%s%n%b' "$GITHUB_SHA" \
            | grep -oE '#[0-9]+' | tr -d '#' | sort -un); do
            TITLE="$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER" --jq .title 2>/dev/null || true)"
            [ -n "$TITLE" ] && ISSUE_LINES="${ISSUE_LINES}- Issue #$NUMBER $TITLE"$'\n'
          done

          {
            echo '自动构建产物，随 dev 分支滚动更新，始终只有这一个预发行版本。'
            echo
            echo '## 本次变更'
            echo
            echo "- \`$HEAD_SHORT\` $HEAD_SUBJECT"
            echo
            echo '## 近期变更'
            echo
            echo "$RECENT" | sed -E 's/^([0-9a-f]+) /- `\1` /'
            if [ -n "$ISSUE_LINES" ]; then
              echo
              printf '%s' "$ISSUE_LINES"
            fi
          } > notes.md

          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" coda-dev.apk sha256.txt \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "开发预览版" \
            --notes-file notes.md

          echo "---" >> "$GITHUB_STEP_SUMMARY"
          cat notes.md >> "$GITHUB_STEP_SUMMARY"