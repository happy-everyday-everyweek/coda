name: Release

# 打 Tag 即出正式发行版本：先重建内核二进制，再打 release APK，最后挂到 Release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 Tag，例如 v0.8.0-core
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 取源码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: 解析版本号
        # tag 经 env 传值，不直接内插进 bash（#23）：
        # 表达式在 shell 解析前展开，输入含 `"; …` 即可注入命令。
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG="$INPUT_TAG"
          # 形状校验必须在写进 GITHUB_ENV 之前（OCR low #827）：workflow_dispatch 的输入
          # 可以是任意文本，含换行时 echo 会往 GITHUB_ENV 写多行，调用方就能给后续所有
          # 步骤注入环境变量（NODE_OPTIONS、LD_PRELOAD 等），而这个 job 持有 contents: write。
          if ! printf '%s' "$TAG" | grep -Eq '^v?[0-9]+\.[0-9]+(\.[0-9]+)?([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::Tag 形状不合法：$TAG（应形如 v1.2.3）"
            exit 1
          fi
          echo "CODA_TAG=$TAG" >> "$GITHUB_ENV"
          echo "CODA_VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          # 与 dev 同一套算法、同一条时间序列，只把渠道位换成 1：
          #   code = 距基准日的分钟数 * 2 + 1
          # 这样正式版与 dev 相差 1，且时间越晚号越大，
          # 用户的「正式版 → dev → 下一个正式版」两个方向都能覆盖安装。
          # 号必须与 Tag 绑定（OCR low #26）：按构建时刻取号时，重跑一条旧 Tag
          # 会生成比之后正式版更大的号，装了重跑版的用户此后再也覆盖不上去。
          # 用该 Tag 的提交时间取号，同一条 Tag 重跑得到完全相同的号。
          TAG_COMMIT_TIME="$(git log -1 --format=%cI "$TAG^{commit}" 2>/dev/null || true)"
          [ -n "$TAG_COMMIT_TIME" ] || TAG_COMMIT_TIME="$(git log -1 --format=%cI HEAD)"
          CODE="$(python3 tools/version-code.py --channel release --at "$TAG_COMMIT_TIME")"
          echo "CODA_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "版本号：$CODE（时间序列 × 2 + 1）" >> "$GITHUB_STEP_SUMMARY"
          # 仓库内固定密钥（keystore/coda-debug.jks）的证书摘要，核对步骤用它比对。
          echo "CODA_SIGNER_SHA256=05011c837e7fd75ae390c9f5d627f4618324676896ff0fbe04146607db841c35" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: pnpm
          cache-dependency-path: kernel/zcode/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # 依赖缓存（OCR low #827）：compile 与 test 各跑一次 Gradle，没有缓存时
          # 每次 push/PR 都要重新下载整棵 AGP/Kotlin 依赖图。
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # 不用 android-actions/setup-android：它的 sdkmanager --licenses 在新版 cmdline-tools
      # 下会停在交互确认（Accept? y/N）并让整步失败。这里改用 runner 预装的 cmdline-tools。
      - name: 准备 Android SDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          ( set +o pipefail; yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 ) || true
          # 见 build.yml 同段说明：装失败就当场失败，不要 || true 吞掉（OCR low #26）。
          if ! "$SDKMANAGER" "build-tools;36.0.0" "ndk;28.2.13676358" > "$RUNNER_TEMP/sdk-install.log" 2>&1; then
            if [ ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt2" ] || [ ! -d "$ANDROID_HOME/ndk/28.2.13676358" ]; then
              cat "$RUNNER_TEMP/sdk-install.log" >&2
              exit 1
            fi
          fi
          echo "NDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      # 载荷每次都在 CI 内重建，不复用任何缓存，避免发出陈旧的内核二进制。
      - name: 重建内核二进制载荷
        run: tools/build-core-payload.sh
      # 注入写坏的载荷装到设备上只会以信号退出，看不出原因；这里先核对结构，坏了当场失败。
      - name: 核对内核载荷结构
        run: python3 tools/verify-sea-payload.py app/src/main/assets/core/zcode

      # Chaquopy 需要的三个 Android 轮子（pydantic-core、jiter、rpds-py）。
      - name: 构建 Android 轮子
        run: tools/build-android-wheels.sh

      - name: 准备发布签名
        env:
          # 这一步只解 base64、写路径，口令一律不在这里引用（OCR low #827）：
          # 注释也说了口令只在 assembleRelease 那一步出现，env 里多挂三个等于把
          # secret 暴露给一个根本不需要它们的步骤。
          KEYSTORE_B64: ${{ secrets.CODA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "未配置 CODA_KEYSTORE_BASE64：release 必须用正式密钥签名。" >&2
            echo "仓库内 keystore/coda-debug.jks 口令公开，任何人都能用它签出可覆盖安装的包，不能作为 release 回落。" >&2
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/coda-release.jks"
          # 只把路径写进 GITHUB_ENV；口令不写（#23）：
          # GITHUB_ENV 会暴露给后续所有步骤，口令只在 assembleRelease 那一步的 env 里引用。
          echo "CODA_KEYSTORE_PATH=$RUNNER_TEMP/coda-release.jks" >> "$GITHUB_ENV"
      - name: 打包 release APK
        env:
          CODA_KEYSTORE_PASSWORD: ${{ secrets.CODA_KEYSTORE_PASSWORD }}
          CODA_KEY_ALIAS: ${{ secrets.CODA_KEY_ALIAS }}
          CODA_KEY_PASSWORD: ${{ secrets.CODA_KEY_PASSWORD }}
        run: |
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          [ -x "$AAPT2" ] || AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          echo "aapt2: $AAPT2"
          ./gradlew :app:assembleRelease \
            -PcodaVersionName="$CODA_VERSION_NAME" \
            -PcodaVersionCode="$CODA_VERSION_CODE" \
            -Pandroid.aapt2FromMavenOverride="$AAPT2"

      - name: 收集产物
        run: |
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          cp "$APK" "coda-$CODA_VERSION_NAME.apk"
          sha256sum "coda-$CODA_VERSION_NAME.apk" | tee sha256.txt
          # 实验性 Web UI 的前端资产：不打进 APK，作为 Release 附件由 App 运行时拉取。
          cd webui && zip -q ../coda-webui.zip index.html client.mjs && cd ..
          cat app/build/outputs/apk/release/output-metadata.json

      # 正式版必须签名固定：签名一换，老用户就装不上新版本。
      # 期望指纹来自 CODA_RELEASE_SIGNER_SHA256（正式密钥的证书摘要）。
      - name: 核对签名
        env:
          RELEASE_SIGNER: ${{ secrets.CODA_RELEASE_SIGNER_SHA256 }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          [ -x "$APKSIGNER" ] || APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "coda-$CODA_VERSION_NAME.apk"
          SIGNER="$("$APKSIGNER" verify --print-certs "coda-$CODA_VERSION_NAME.apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':' | tr 'A-Z' 'a-z')"
          echo "签名摘要 $SIGNER"
          if [ -z "$SIGNER" ]; then
            echo "!! 读不到签名摘要" >&2
            exit 1
          fi
          # 正式包绝不能由仓库内公开口令的 debug 密钥签出。
          if [ "$SIGNER" = "$CODA_SIGNER_SHA256" ]; then
            echo "!! release 使用了仓库内公开 debug 密钥，拒绝发布" >&2
            exit 1
          fi
          # 外部密钥路径同样要 pin：没有期望值就不发布，避免签名悄悄换掉。
          if [ -z "$RELEASE_SIGNER" ]; then
            echo "!! 未配置 CODA_RELEASE_SIGNER_SHA256，无法核对正式签名，拒绝发布" >&2
            exit 1
          fi
          EXPECTED="$(echo "$RELEASE_SIGNER" | tr -d ':' | tr 'A-Z' 'a-z')"
          if [ "$SIGNER" != "$EXPECTED" ]; then
            echo "!! 签名与期望的正式密钥不一致：期望 $EXPECTED" >&2
            exit 1
          fi

      # 应用内更新读取的版本清单。走 releases/latest/download/update.json 静态下载，
# 不消耗 GitHub API 限额，并带 sha256 供下载后校验。
      - name: 生成更新清单
        run: |
          SIZE="$(stat -c%s "coda-$CODA_VERSION_NAME.apk")"
          SHA="$(cut -d' ' -f1 sha256.txt)"
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$CODA_TAG/coda-$CODA_VERSION_NAME.apk"
          python3 - "$SIZE" "$SHA" "$APK_URL" <<'PY'
          import json, os, sys, datetime
          size, sha, url = sys.argv[1], sys.argv[2], sys.argv[3]
          data = {
              "schemaVersion": 1,
              "channel": "release",
              "tag": os.environ["CODA_TAG"],
              "versionCode": int(os.environ["CODA_VERSION_CODE"]),
              "versionName": os.environ["CODA_VERSION_NAME"],
              "apkUrl": url,
              "size": int(size),
              "sha256": sha,
              "publishedAt": datetime.datetime.now(datetime.timezone.utc)
                               .replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "notes": "",
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$CODA_TAG" \
            "coda-$CODA_VERSION_NAME.apk" \
            coda-webui.zip \
            sha256.txt \
            update.json \
            --title "Coda $CODA_VERSION_NAME" \
            --generate-notes