name: Release

# 打 Tag 即出正式发行版本：先重建内核二进制，再打 release APK，最后挂到 Release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 Tag，例如 v0.8.0-core
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 取源码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: 解析版本号
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "CODA_TAG=$TAG" >> "$GITHUB_ENV"
          echo "CODA_VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          echo "CODA_VERSION_CODE=$(( 10000 + ${{ github.run_number }} ))" >> "$GITHUB_ENV"
          # 仓库内固定密钥（keystore/coda-debug.jks）的证书摘要，核对步骤用它比对。
          echo "CODA_SIGNER_SHA256=05011c837e7fd75ae390c9f5d627f4618324676896ff0fbe04146607db841c35" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: pnpm
          cache-dependency-path: kernel/zcode/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 不用 android-actions/setup-android：它的 sdkmanager --licenses 在新版 cmdline-tools
      # 下会停在交互确认（Accept? y/N）并让整步失败。这里改用 runner 预装的 cmdline-tools。
      - name: 准备 Android SDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;36.0.0" > /dev/null 2>&1 || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      # 载荷每次都在 CI 内重建，不复用任何缓存，避免发出陈旧的内核二进制。
      - name: 重建内核二进制载荷
        run: tools/build-core-payload.sh
      # 注入写坏的载荷装到设备上只会以信号退出，看不出原因；这里先核对结构，坏了当场失败。
      - name: 核对内核载荷结构
        run: python3 tools/verify-sea-payload.py app/src/main/assets/core/zcode

      - name: 准备发布签名
        env:
          KEYSTORE_B64: ${{ secrets.CODA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CODA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CODA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CODA_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "未配置 CODA_KEYSTORE_BASE64，release 回落到仓库内固定密钥（keystore/coda-debug.jks）"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/coda-release.jks"
          {
            echo "CODA_KEYSTORE_PATH=$RUNNER_TEMP/coda-release.jks"
            echo "CODA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "CODA_KEY_ALIAS=$KEY_ALIAS"
            echo "CODA_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: 打包 release APK
        run: |
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          [ -x "$AAPT2" ] || AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          echo "aapt2: $AAPT2"
          ./gradlew :app:assembleRelease \
            -PcodaVersionName="$CODA_VERSION_NAME" \
            -PcodaVersionCode="$CODA_VERSION_CODE" \
            -Pandroid.aapt2FromMavenOverride="$AAPT2"

      - name: 收集产物
        run: |
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          cp "$APK" "coda-$CODA_VERSION_NAME.apk"
          sha256sum "coda-$CODA_VERSION_NAME.apk" | tee sha256.txt
          cat app/build/outputs/apk/release/output-metadata.json

      # 正式版同样要求签名固定：签名一换，老用户就装不上新版本。
      # 未配置 CODA_KEYSTORE_BASE64 时用的是仓库内固定密钥，摘要与下面一致。
      - name: 核对签名
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          [ -x "$APKSIGNER" ] || APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "coda-$CODA_VERSION_NAME.apk"
          SIGNER="$("$APKSIGNER" verify --print-certs "coda-$CODA_VERSION_NAME.apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':' | tr 'A-Z' 'a-z')"
          echo "签名摘要 $SIGNER"
          if [ "$SIGNER" != "$CODA_SIGNER_SHA256" ] && [ -z "$CODA_KEYSTORE_PATH" ]; then
            echo "!! 签名与仓库固定密钥不一致：期望 $CODA_SIGNER_SHA256" >&2
            exit 1
          fi

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$CODA_TAG" \
            "coda-$CODA_VERSION_NAME.apk" \
            sha256.txt \
            --title "Coda $CODA_VERSION_NAME" \
            --generate-notes