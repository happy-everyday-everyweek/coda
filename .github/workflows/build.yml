name: Build

# 仓库级通用构建验证：任何分支的 push 与 PR 都跑。
# 编译 Android 源码，并验证 Personal Agent 的 Python 消息入口与宿主工具契约。
# 可安装产物与版本号、签名、更新清单一律由发布流或手动 APK 构建产出。
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_apk:
        description: 同时构建可安装的 debug APK（仅作为 Actions 产物，不进入 Release）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          ( set +o pipefail; yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 ) || true
          "$SDKMANAGER" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: 编译 Kotlin 与生成 Python 包
        run: |
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          [ -x "$AAPT2" ] || AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          ./gradlew :app:compileDebugKotlin \
            -x installDebugPythonRequirements \
            -Pandroid.aapt2FromMavenOverride="$AAPT2" \
            --stacktrace

      - name: 安卓宿主桥单测
        run: ./gradlew :app:testDebugUnitTest -x installDebugPythonRequirements --stacktrace

      - name: 安装 Personal Agent 测试依赖
        working-directory: kernel/maibot-lite
        run: |
          grep -v '^maim-message' requirements-lite.txt > /tmp/req-nomaim.txt
          python -m pip install -r /tmp/req-nomaim.txt
          python -m pip install --no-deps 'maim-message==0.6.8'
          python -m pip install pytest pytest-asyncio

      - name: 测试 Personal Agent 工具契约
        working-directory: kernel/maibot-lite
        run: python -m pytest tests/test_lite_coding_tool.py -q

  # platform/ 参考实现的通用构建：每次 push/PR 都产出 npm 包、Web 资产和发布清单。
  # 只作为 Actions 产物；正式/预发行附件由 release.yml 与 dev-prerelease.yml 生成。
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: ./.github/actions/build-platform
        id: platform
      - name: 平台契约测试
        working-directory: platform
        run: node --test "test/**/*.test.mjs"
      - uses: actions/upload-artifact@v4
        with:
          name: coda-platform-${{ steps.platform.outputs.version }}
          if-no-files-found: error
          path: |
            ${{ steps.platform.outputs.tgz }}
            ${{ steps.platform.outputs.webzip }}
            ${{ steps.platform.outputs.manifest }}
            platform/dist/web-version.json

  # 只有手动触发并勾选 build_apk 时才打包：分支构建不产可安装产物，更不会进 Release。
  apk:
    if: github.event_name == 'workflow_dispatch' && inputs.build_apk
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYO3_CROSS: "1"
      PYO3_CROSS_PYTHON_VERSION: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 准备 Android SDK 与 NDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          ( set +o pipefail; yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 ) || true
          "$SDKMANAGER" "build-tools;36.0.0" "ndk;28.2.13676358" > /dev/null 2>&1
          echo "NDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: 构建 Android 轮子
        run: tools/build-android-wheels.sh

      - name: 构建 APK
        run: |
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          ./gradlew :app:assembleDebug \
            -Pandroid.aapt2FromMavenOverride="$AAPT2" \
            --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: coda-debug-${{ github.run_id }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
