name: Platform

# 跨端平台参考实现（platform/）的契约测试。
# 零外部依赖，Node 24 内置 node:sqlite / node:crypto / node:test。
on:
  push:
    paths:
      - "platform/**"
      - ".github/workflows/platform.yml"
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 能力矩阵与证据一致性
        working-directory: platform
        run: |
          node tools/capability-matrix.mjs --check
          node tools/fixture-index.mjs --check
      - name: 契约测试
        working-directory: platform
        run: |
          node --version
          node --test "test/**/*.test.mjs"
