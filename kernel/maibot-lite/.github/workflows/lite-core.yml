name: lite-core

# MaiBot Android 精简构建的持续集成
#
# 目标：
#   1. 校验核心链路可在"没有 Web 栈 / 没有科学计算栈"的环境下导入（门禁）
#   2. 为 arm64 交叉编译 10 个原生扩展并产出 wheel
#   3. 汇总 wheel 体积，供 Android 打包阶段评估 APK 增量
#
# 触发：push / PR / 手动

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_wheels:
        description: "是否编译 aarch64 wheel"
        type: boolean
        default: true

concurrency:
  group: lite-core-${{ github.ref }}
  cancel-in-progress: true

env:
  PY_MINOR: "3.12"

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. 门禁：核心不得依赖重依赖
  # ─────────────────────────────────────────────────────────────
  gate:
    name: 核心依赖门禁
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 不用 cache: pip —— 它会扫描仓库里的 lockfile，
          # 而本分支已移除 dashboard/（原 npm lockfile）等目录。
          cache: ""

      - name: 安装精简依赖
        run: |
          python -m pip install --upgrade pip
          # maim-message 的 METADATA 硬依赖 fastapi/aiohttp/websockets，但我们只用到
          # 它的纯数据模型（由 src/common/maim_lite.py 绕过 __init__）。
          # 因此先装其余依赖，最后单独 --no-deps 安装它。
          grep -v '^maim-message' requirements-lite.txt > /tmp/req-nomaim.txt
          python -m pip install -r /tmp/req-nomaim.txt
          python -m pip install --no-deps 'maim-message==0.6.8'

      - name: 确认重依赖确实不存在
        run: |
          python - <<'PY'
          import importlib.util as u
          # 这些是本分支刻意移除的重型栈，必须完全缺席：
          #   fastapi/uvicorn/starlette - WebUI 与官方 API server 专属
          #   pandas/scipy/pyarrow/faiss/playwright/matplotlib - 被剥离的科学计算栈
          heavy = ["fastapi", "uvicorn", "starlette", "pandas", "scipy",
                   "pyarrow", "faiss", "playwright", "matplotlib"]
          present = [n for n in heavy if u.find_spec(n) is not None]
          print("已安装的重依赖:", present or "无")
          if present:
              raise SystemExit(f"精简依赖里不应出现: {present}")

          # 以下为纯 Python 或有 aarch64 wheel，且是某个真实依赖的传递依赖，
          # 允许存在，但必须由门禁脚本证明"核心链路不导入它们"：
          #   aiohttp/websockets <- google-genai 的硬依赖
          allowed_transitive = ["aiohttp", "websockets"]
          print("允许存在的传递依赖:", [n for n in allowed_transitive
                                        if u.find_spec(n) is not None])
          PY

      - name: 运行核心门禁
        run: python scripts/check_lite_core.py --strict

      - name: 测试 Android Lite 消息入口
        run: |
          python -m pip install pytest pytest-asyncio
          MAIBOT_INSTANCE_DIR="$RUNNER_TEMP/lite-test-instance" \
            python -m pytest tests/test_lite_runtime.py -q

      - name: 静态检查 —— 核心路径不得直接 import 重型包
        run: |
          python - <<'PY'
          import pathlib, re, sys

          # 只扫描"核心聊天链路"。以下目录是刻意保留但不参与嵌入式核心的：
          #   src/webui/                  - WebUI 服务端（本构建不启动）
          #   src/common/message_server/  - 官方 API/WS server（本构建不启动）
          #   src/plugin_runtime/         - 插件运行时（本构建不启动）
          #   src/A_memorix/              - 长期记忆（已 disabled）
          #   src/agent/                  - 外接 Agent（已 disabled）
          #   src/mcp_module/             - MCP 服务端（已 disabled）
          #   src/computer/               - Windows Sandbox 桥（平台不适用）
          EXCLUDED = {
              "webui", "plugin_runtime", "A_memorix", "agent",
              "mcp_module", "computer", "plugin_market",
          }
          EXCLUDED_FILES = {"common/message_server"}

          root = pathlib.Path("src")
          # 只匹配"模块级"导入（行首无缩进）。函数内的延迟导入是本分支刻意采用
          # 的剥离手法，不构成负担：真正危险的是模块导入期就被拉起的重依赖。
          pattern = re.compile(
              r"^(?:from|import)\s+(fastapi|uvicorn|starlette|pandas|scipy|"
              r"pyarrow|faiss|playwright|matplotlib)\b", re.MULTILINE)
          hits = []
          for py in root.rglob("*.py"):
              parts = py.parts
              if "__pycache__" in parts:
                  continue
              if len(parts) > 1 and parts[1] in EXCLUDED:
                  continue
              if any("/".join(parts[1:]).startswith(f) for f in EXCLUDED_FILES):
                  continue
              text = py.read_text(encoding="utf-8", errors="ignore")
              for m in pattern.finditer(text):
                  hits.append(f"{py}: {m.group(0).strip()}")
          if hits:
              print("核心路径发现直接重依赖导入:", *hits, sep="\n  ")
              sys.exit(1)
          print("OK: 核心路径无直接重依赖导入")
          PY

      - name: 校验禁用的子系统未被核心硬依赖
        run: |
          python - <<'PY'
          import pathlib, re, sys

          # 与上一步一致：这些目录刻意保留但不在嵌入式核心范围内。
          EXCLUDED = {
              "webui", "plugin_runtime", "A_memorix", "agent",
              "mcp_module", "computer", "plugin_market",
          }

          # 核心路径上不允许出现"模块级"硬导入 A_memorix；
          # 必须一律经由 src/common/optional_features.py 的延迟导入。
          bad = re.compile(r"^from\s+src\.A_memorix\.[\w.]+\s+import", re.MULTILINE)
          hits = []
          for py in pathlib.Path("src").rglob("*.py"):
              parts = py.parts
              if "__pycache__" in parts:
                  continue
              if len(parts) > 1 and parts[1] in EXCLUDED:
                  continue
              if bad.search(py.read_text(encoding="utf-8", errors="ignore")):
                  hits.append(str(py))
          if hits:
              print("核心路径模块级硬导入 A_memorix:", *hits, sep="\n  ")
              sys.exit(1)
          print("OK: 核心路径的 A_memorix 均为延迟导入")
          PY

  # ─────────────────────────────────────────────────────────────
  # 2. 收集 aarch64 wheel
  #
  # 实测结论：这 10 个原生扩展在 PyPI 上都有 manylinux aarch64 官方 wheel，
  # 无需交叉编译。原先用 manylinux_2_28_aarch64 容器编译的写法有两个问题：
  #   1. GitHub 托管的 aarch64 容器在本仓库环境下起不来（container not running）
  #   2. 完全没必要 —— pip download 指定 platform 即可拿到官方轮子
  #
  # 注意 platform tag 要同时给 manylinux2014_aarch64 与 manylinux_2_28_aarch64：
  # pydantic-core 只发 2_17，pillow/numpy 只发 2_27+。
  # ─────────────────────────────────────────────────────────────
  wheels:
    name: 收集 aarch64 wheel
    if: github.event_name != 'pull_request' || inputs.build_wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: ""

      - name: 下载 aarch64 wheel
        run: |
          set -eux
          mkdir -p wheelhouse
          # 优先用镜像（中国大陆网络更稳），失败再回退官方源
          INDEX="-i https://mirrors.aliyun.com/pypi/simple"
          python -m pip install --upgrade pip
          python -m pip download --only-binary=:all: --no-deps --dest wheelhouse \
            $INDEX \
            --platform manylinux2014_aarch64 \
            --platform manylinux_2_28_aarch64 \
            --python-version 3.12 --implementation cp --abi cp312 \
            'numpy>=2.2.6' 'pydantic-core>=2.46.3' 'greenlet>=3.4.0' \
            'pillow>=12.3.0' 'msgpack>=1.2.1' 'rapidfuzz>=3.14.5' \
            'watchfiles>=1.1.1' 'zstandard>=0.25.0' 'rpds-py>=0.30.0' \
            'cryptography>=50.0.1'
          ls -lh wheelhouse

      - name: 校验确实是 aarch64 轮子
        run: |
          set -eux
          count=$(ls wheelhouse/*.whl | wc -l)
          echo "wheel 数量: $count"
          test "$count" -eq 10
          for w in wheelhouse/*.whl; do
            case "$w" in
              *aarch64*) ;;
              *) echo "非 aarch64 轮子: $w"; exit 1 ;;
            esac
          done
          echo "OK: 全部为 aarch64 wheel"

      - name: 体积统计
        run: |
          {
            echo "### aarch64 wheel 明细"
            echo '```'
            du -h wheelhouse/*.whl | sort -h
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: all-wheels
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # 3. 汇总体积，评估 APK 增量
  # ─────────────────────────────────────────────────────────────
  summarize:
    name: 汇总产物体积
    needs: wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: all-wheels

      - name: 汇总
        run: |
          {
            echo "## aarch64 wheel 体积汇总"
            echo ""
            echo "| 包 | 文件 | 压缩后 |"
            echo "|---|---|---|"
            find artifacts -name '*.whl' -printf '%s\t%p\n' \
              | sort -rn \
              | while IFS=$'\t' read -r size path; do
                  printf '| %s | %s | %s |\n' \
                    "$(basename "$path" .whl | cut -d- -f1)" \
                    "$(basename "$path")" \
                    "$(numfmt --to=iec --suffix=B "$size")"
                done
            echo ""
            total=$(find artifacts -name '*.whl' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
            echo "**合计: $(numfmt --to=iec --suffix=B "$total")**"
            echo ""
            echo "> 对比：上游 MaiBot 全功能构建的 site-packages 为 786MB。"
            echo "> 以上为 wheel 压缩体积，安装后解压通常为 2~3 倍。"
          } >> "$GITHUB_STEP_SUMMARY"
