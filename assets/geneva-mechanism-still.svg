<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" data-plotter="" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity=".8" role="img" aria-label="Geneva mechanism: continuous input rotation produces quarter-turn indexing with a rest"><title>Geneva mechanism</title>
