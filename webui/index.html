<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coda Web</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --border:#2a2f3a; --text:#e8eaf0; --sub:#9aa1af; --accent:#4f8cff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC",sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; background:var(--card); }
  header .dot { width:10px; height:10px; border-radius:50%; background:var(--sub); }
  header .dot.on { background:#3fd68f; }
  header h1 { font-size:15px; font-weight:600; }
  header .state { font-size:12px; color:var(--sub); margin-left:auto; }
  main { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:82%; padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .msg.assistant { align-self:flex-start; background:var(--card); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .msg .meta { font-size:11px; color:var(--sub); margin-top:4px; opacity:.8; }
  footer { padding:12px 20px 18px; border-top:1px solid var(--border); background:var(--card); display:flex; gap:10px; }
  footer textarea { flex:1; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:10px 14px; font-size:14px; font-family:inherit; resize:none; height:46px; outline:none; }
  footer textarea:focus { border-color:var(--accent); }
  footer button { background:var(--accent); color:#fff; border:none; border-radius:12px; padding:0 22px; font-size:14px; cursor:pointer; }
  footer button:disabled { opacity:.5; cursor:not-allowed; }
  footer button.stop { background:#e5484d; }
  .empty { color:var(--sub); text-align:center; margin-top:40px; font-size:13px; }
  .badge { font-size:11px; color:var(--sub); border:1px solid var(--border); border-radius:6px; padding:2px 8px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>Coda Web <span class="badge">实验性</span></h1>
  <span class="state" id="state">连接中…</span>
</header>
<main id="list"><div class="empty">暂无消息，发送第一条开始对话</div></main>
<footer>
  <textarea id="input" placeholder="输入消息…" rows="1"></textarea>
  <button id="btnStop" class="stop" style="display:none">停止</button>
  <button id="btnSend">发送</button>
</footer>
<script type="module">
import { snapshotSig, planRender, createPoller, createSender, dotOn, nextDelay } from './client.mjs';
const $ = (id) => document.getElementById(id);
const list = $('list'), input = $('input');
// 逻辑都在 client.mjs（有 node --test 覆盖），这里只做 DOM 搬运。
let prevMsgs = [], lastSig = '', running = false;

function nodeFor(m) {
  const div = document.createElement('div');
  div.className = 'msg ' + (m.role === 'user' ? 'user' : 'assistant');
  div.dataset.id = m.id ?? '';
  div.textContent = m.text || '';
  return div;
}

function render(state) {
  running = !!state.running;
  $('dot').classList.toggle('on', dotOn({ ok: true, state }));
  // 内核没起来时动作会被延后，必须显式告知，否则点了发送没反应像坏了。
  $('state').textContent = state.kernelReady === false
    ? '内核启动中…'
    : (running ? 'Agent 运行中…' : (state.model ? state.model.id : '就绪'));
  $('btnSend').style.display = running ? 'none' : '';
  $('btnStop').style.display = running ? '' : 'none';

  const msgs = state.messages || [];
  // 签名含首条 id：/api/state 只回最后 200 条，窗口滑动后条数恒定，只看条数会永久卡住。
  const sig = snapshotSig(msgs);
  if (sig === lastSig) return;
  lastSig = sig;

  // 只有用户原本就在底部附近时才跟随；正在往上翻历史时不要把他拉回来。
  const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 40;
  const plan = planRender(prevMsgs, msgs);
  if (msgs.length === 0) {
    list.innerHTML = '<div class="empty">暂无消息，发送第一条开始对话</div>';
  } else if (plan.rebuild) {
    list.innerHTML = '';
    for (const m of msgs) list.appendChild(nodeFor(m));
  } else {
    // 增量：只追加新节点、只改变化节点的文本，选中文字与滚动位置得以保留。
    const empty = list.querySelector('.empty');
    if (empty) empty.remove();
    for (const m of plan.update) {
      const el = list.querySelector('[data-id="' + CSS.escape(String(m.id ?? '')) + '"]');
      if (el) el.textContent = m.text || '';
    }
    for (const m of plan.append) list.appendChild(nodeFor(m));
  }
  prevMsgs = msgs;
  if (atBottom) list.scrollTop = list.scrollHeight;
}

function onPollError() {
  $('dot').classList.remove('on');
  $('state').textContent = '连接断开，重试中…';
}

// 单飞 + 序号：send()/stop() 的立即刷新与定时链不会并发，迟到响应不覆盖新状态。
const poller = createPoller({
  fetchState: () => fetch('/api/state', { cache: 'no-store' }),
  render,
  onError: onPollError,
});
const poll = () => poller.poll();

const sender = createSender({
  post: (text) => fetch('/api/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text }),
  }),
  alert: (m) => window.alert(m),
  clearInput: () => { input.value = ''; },
  refresh: () => { lastSig = ''; poll(); },
  // 在途时禁用按钮：连按 Enter 不再产生第二个必被服务端拒绝的请求。
  setBusy: (b) => { $('btnSend').disabled = b; },
  isRunning: () => running,
});

async function stop() {
  $('btnStop').disabled = true;
  try {
    await fetch('/api/stop', { method: 'POST' });
  } catch {
    onPollError();
  } finally {
    $('btnStop').disabled = false;
  }
  poll();
}

$('btnSend').onclick = () => sender.send(input.value);
$('btnStop').onclick = stop;
input.addEventListener('keydown', (e) => {
  // 中文输入法里 Enter 是“上屏候选词”，此时不能当成发送。
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
    e.preventDefault();
    sender.send(input.value);
  }
});
// 自适应轮询：运行中 1.5s、空闲 3s、页面隐藏 15s。
let timer = null;
function schedule() {
  clearTimeout(timer);
  timer = setTimeout(async () => {
    if (!document.hidden) await poll();
    schedule();
  }, nextDelay({ running, hidden: document.hidden }));
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { schedule(); poll(); }
});
schedule();
</script>
</body>
</html>
