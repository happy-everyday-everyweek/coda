<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coda Web</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --border:#2a2f3a; --text:#e8eaf0; --sub:#9aa1af; --accent:#4f8cff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC",sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; background:var(--card); }
  header .dot { width:10px; height:10px; border-radius:50%; background:var(--sub); }
  header .dot.on { background:#3fd68f; }
  header h1 { font-size:15px; font-weight:600; }
  header .state { font-size:12px; color:var(--sub); margin-left:auto; }
  main { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:82%; padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .msg.assistant { align-self:flex-start; background:var(--card); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .msg .meta { font-size:11px; color:var(--sub); margin-top:4px; opacity:.8; }
  footer { padding:12px 20px 18px; border-top:1px solid var(--border); background:var(--card); display:flex; gap:10px; }
  footer textarea { flex:1; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:10px 14px; font-size:14px; font-family:inherit; resize:none; height:46px; outline:none; }
  footer textarea:focus { border-color:var(--accent); }
  footer button { background:var(--accent); color:#fff; border:none; border-radius:12px; padding:0 22px; font-size:14px; cursor:pointer; }
  footer button:disabled { opacity:.5; cursor:not-allowed; }
  footer button.stop { background:#e5484d; }
  .empty { color:var(--sub); text-align:center; margin-top:40px; font-size:13px; }
  .badge { font-size:11px; color:var(--sub); border:1px solid var(--border); border-radius:6px; padding:2px 8px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>Coda Web <span class="badge">实验性</span></h1>
  <span class="state" id="state">连接中…</span>
</header>
<main id="list"><div class="empty">暂无消息，发送第一条开始对话</div></main>
<footer>
  <textarea id="input" placeholder="输入消息…" rows="1"></textarea>
  <button id="btnStop" class="stop" style="display:none">停止</button>
  <button id="btnSend">发送</button>
</footer>
<script>
const $ = (id) => document.getElementById(id);
const list = $('list'), input = $('input');
let lastCount = -1, running = false;

function render(state) {
  running = !!state.running;
  $('dot').classList.toggle('on', true);
  // 内核没起来时动作会被延后，必须显式告知，否则点了发送没反应像坏了。
  if (state.kernelReady === false) {
    $('state').textContent = '内核启动中…';
  } else {
    $('state').textContent = running ? 'Agent 运行中…' : (state.model ? state.model.id : '就绪');
  }
  $('btnSend').style.display = running ? 'none' : '';
  $('btnStop').style.display = running ? '' : 'none';
  const msgs = state.messages || [];
  if (msgs.length === lastCount && !running) return; // 无新消息且不运行时跳过重绘
  lastCount = msgs.length;
  list.innerHTML = '';
  if (msgs.length === 0) {
    list.innerHTML = '<div class="empty">暂无消息，发送第一条开始对话</div>';
    return;
  }
  for (const m of msgs) {
    const div = document.createElement('div');
    div.className = 'msg ' + (m.role === 'user' ? 'user' : 'assistant');
    div.textContent = m.text || '';
    list.appendChild(div);
  }
  list.scrollTop = list.scrollHeight;
}

async function poll() {
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    if (r.ok) render(await r.json());
  } catch { $('state').textContent = '连接断开，重试中…'; }
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  try {
    const r = await fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    const j = await r.json();
    if (j.error) { alert(j.error); return; }
    lastCount = -1; // 立即刷新
    poll();
  } catch { alert('发送失败'); }
}

async function stop() {
  await fetch('/api/stop', { method: 'POST' }).catch(() => {});
  poll();
}

$('btnSend').onclick = send;
$('btnStop').onclick = stop;
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
// 自适应轮询：运行中 1.5s、空闲 3s。不能写 setInterval(poll, running ? 1500 : 3000)
// ——那个表达式的 running 在定义时就固定了，永远不会变。
let timer = null;
function schedule() {
  clearTimeout(timer);
  timer = setTimeout(async () => {
    await poll();
    schedule();
  }, running ? 1500 : 3000);
}
schedule();
</script>
</body>
</html>
